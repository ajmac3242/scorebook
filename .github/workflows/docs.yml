name: Terraform Docs & Architecture Diagram

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------
  # Job 1: Update infra/README.md using terraform-docs
  # ---------------------------------------------------------------
  terraform-docs:
    name: Update Terraform README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render terraform-docs and push to repo
        uses: terraform-docs/gh-actions@v1.3.0
        with:
          working-dir: infra
          output-file: README.md
          output-method: inject
          git-push: "true"
          git-commit-message: "docs(infra): auto-update terraform-docs README [skip ci]"

  # ---------------------------------------------------------------
  # Job 2: Generate architecture diagram
  # Runs independently - does not block or depend on terraform-docs
  # ---------------------------------------------------------------
  architecture-diagram:
    name: Generate Architecture Diagram
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Graphviz (required by diagrams library)
        run: sudo apt-get update -y && sudo apt-get install -y graphviz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install diagram dependencies
        run: pip install diagrams

      - name: Generate architecture diagram
        run: |
          mkdir -p docs
          cat > /tmp/gen_diagram.py << 'PYEOF'
          from diagrams import Diagram, Cluster, Edge
          from diagrams.aws.network import CloudFront, APIGateway
          from diagrams.aws.storage import S3
          from diagrams.aws.compute import Lambda
          from diagrams.aws.database import Dynamodb
          from diagrams.aws.security import Cognito
          from diagrams.onprem.client import User
          with Diagram(
            "Scorebook - AWS Architecture",
            filename="docs/architecture",
            outformat="png",
            show=False,
            direction="LR",
          ):
            user = User("Browser / App")
            with Cluster("Auth"):
              cognito = Cognito("Cognito\nUser Pool")
            with Cluster("Frontend"):
              s3 = S3("S3\n(Static Hosting)")
              cf = CloudFront("CloudFront\nDistribution")
            with Cluster("Backend"):
              apigw = APIGateway("API Gateway v2\n(HTTP API + JWT Auth)")
              fn = Lambda("Lambda\n(api_handler)")
              db = Dynamodb("DynamoDB\n(BasketballStats)")
            user >> cf >> s3
            user >> cognito
            user >> apigw
            apigw >> Edge(label="JWT via Cognito") >> cognito
            apigw >> fn >> db
          PYEOF
          python /tmp/gen_diagram.py

      - name: Commit diagram if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add docs/architecture.png
          if git diff --cached --quiet; then
            echo "No diagram changes to commit."
          else
            git commit -m "docs: auto-update architecture diagram [skip ci]"
            git push
          fi
