name: Pull Request Quality & Tests

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------
  # Combined Quality: Lint, Format, and Test
  # Combined to avoid git auto-commit race conditions
  # ---------------------------------------------------------------
  quality:
    name: Quality Checks (FE + BE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --- Backend ---
      - name: Backend: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Backend: Lint & Auto-fix
        working-directory: backend
        run: npm run lint -- --fix || echo "Lint had errors, some might be fixed"

      - name: Backend: Format
        working-directory: backend
        run: npx prettier --write "src/**/*.ts"

      - name: Backend: Run Tests with Coverage
        working-directory: backend
        run: npm run test:coverage
        continue-on-error: false

      - name: Backend: Build for Infra Plan
        working-directory: backend
        run: |
          npm run build
          npm prune --production
          zip -r ../lambda.zip dist node_modules

      # --- Frontend ---
      - name: Frontend: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend: Lint & Auto-fix
        working-directory: frontend
        run: npm run lint -- --fix || echo "Lint had errors, some might be fixed"

      - name: Frontend: Format
        working-directory: frontend
        run: npx prettier --write "src/**/*.{ts,tsx}"

      - name: Frontend: Run Tests with Coverage
        working-directory: frontend
        run: npx vitest run --coverage
        continue-on-error: false

      # --- Shared Artifacts & Commit ---
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            backend/coverage/lcov-report/
            frontend/coverage/
          retention-days: 1

      - name: Upload lambda.zip for Infra Plan
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip-pr
          path: lambda.zip
          retention-days: 1

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format and lint fixes (FE + BE)"
          file_pattern: "backend/src/** frontend/src/**"

  # ---------------------------------------------------------------
  # Infrastructure: Terraform Plan
  # ---------------------------------------------------------------
  infra-plan:
    name: Infrastructure Plan
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - name: Download lambda.zip artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip-pr
          # downloads to root (default for download-artifact@v4 if path not specified? No, let's be explicit)
          path: .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: true

      - name: Base Plan
        working-directory: infra/base
        run: |
          terraform init
          terraform plan -no-color

      - name: App Plan
        working-directory: infra/app
        run: |
          terraform init
          terraform plan -no-color

  # ---------------------------------------------------------------
  # Report: Consolidated Coverage Comment
  # ---------------------------------------------------------------
  report-coverage:
    name: Report Coverage
    runs-on: ubuntu-latest
    needs: [quality]
    if: always()
    steps:
      - name: Download Coverage Reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: coverage-reports
        continue-on-error: true

      - name: Post Coverage Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ### 📊 Test Coverage Report

            **Backend & Frontend Coverage:**
            Check artifacts for detailed coverage reports.

            *Note: Full HTML reports are available in the Actions artifacts.*
