name: Terraform Integration Tests

# Manual trigger only - these tests deploy real AWS resources
# Run this before major infrastructure changes
on:
  workflow_dispatch:
  # Optionally run on PRs that modify infra code
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terratest.yml'

permissions:
  id-token: write  # Required for requesting the JWT (OIDC)
  contents: read   # Required for actions/checkout

jobs:
  terratest:
    name: Run Terratest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: infra/tests/go.sum

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Build backend for Lambda test
        run: |
          cd backend
          npm install --production
          npm install --save-dev typescript @types/node
          npm run build
          zip -r ../infra/lambda.zip dist node_modules

      - name: Download Go dependencies
        working-directory: infra/tests
        run: go mod download

      - name: Run Terratest
        working-directory: infra/tests
        run: |
          # Run tests with verbose output
          go test -v -timeout 60m
        env:
          AWS_DEFAULT_REGION: us-east-1

      - name: Cleanup on failure
        if: failure()
        working-directory: infra
        run: |
          # Attempt to destroy any partially created resources
          terraform destroy -auto-approve || true
