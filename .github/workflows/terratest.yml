name: Terraform Integration Tests

# Manual trigger only - these tests deploy real AWS resources
# Run this before major infrastructure changes
on:
  workflow_dispatch:
  # DISABLED: Terratest currently lacks proper isolation and can affect production resources.
  # Re-enable only after implementing mock providers or dedicated test environments.
  # pull_request:
  #   paths:
  #     - 'infra/**'
  #     - '.github/workflows/terratest.yml'

concurrency:
  group: terratest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # Required for requesting the JWT (OIDC)
  contents: read  # Required for actions/checkout

jobs:
  terratest:
    name: Run Terratest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Initialize Go module
        working-directory: infra/tests
        run: go mod tidy

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: infra/tests/go.sum

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Build backend for Lambda test
        timeout-minutes: 5
        run: |
          cd backend
          pnpm install --frozen-lockfile
          pnpm run build
          zip -r ../infra/lambda.zip dist node_modules


      - name: Run Terratest
        timeout-minutes: 10
        working-directory: infra/tests
        run: |
          echo "::group::Run Terratest"
          # Run tests with verbose output
          go test -v -timeout 8m
          echo "::endgroup::"
        env:
          AWS_DEFAULT_REGION: us-east-1

      - name: Cleanup on failure
        if: failure()
        working-directory: infra
        run: |
          # Attempt to destroy any partially created resources
          terraform destroy -auto-approve || true

      - name: Upload Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terratest-failure-logs
          path: |
            infra/tests/*.log
            infra/*.zip
            infra/.terraform.lock.hcl
          if-no-files-found: ignore
