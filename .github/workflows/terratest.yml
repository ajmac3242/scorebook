name: Terraform Integration Tests

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Basketball Stats"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  terratest:
    name: Run Terratest Suite
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Setup Node for backend build
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build backend for Lambda test
        run: |
          cd backend
          npm ci
          npm run build
          npm prune --production
          zip -r ../infra/lambda.zip dist node_modules

      - name: Initialize Go module and download dependencies
        working-directory: infra/tests
        run: go mod tidy

      - name: Run Terratest
        working-directory: infra/tests
        run: go test -v -timeout 60m
        env:
          AWS_DEFAULT_REGION: us-east-1

      - name: Cleanup on failure
        if: failure()
        working-directory: infra
        run: terraform destroy -auto-approve || true
