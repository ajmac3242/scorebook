  # ---------------------------------------------------------------
  # Decision Gate
  # ---------------------------------------------------------------
  decision-gate:
    name: Decision Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [filter, code-auto-fix, backend-ci, frontend-ci, docs-build]
    outputs:
      can_merge: ${{ steps.decide.outputs.can_merge }}
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: Write CI Summary
        run: |
          echo "### CI Run Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.filter.outputs.backend == 'true' && (needs.backend-ci.result == 'success' && '✅ Success' || needs.backend-ci.result == 'skipped' && 'ℹ️ Skipped' || '❌ Failed') || 'ℹ️ Unchanged' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.filter.outputs.frontend == 'true' && (needs.frontend-ci.result == 'success' && '✅ Success' || needs.frontend-ci.result == 'skipped' && 'ℹ️ Skipped' || '❌ Failed') || 'ℹ️ Unchanged' }} |" >> $GITHUB_STEP_SUMMARY
          # echo "| E2E Tests | ${{ needs.filter.outputs.frontend == 'true' && (needs.e2e.result == 'success' && '✅ Success' || needs.e2e.result == 'skipped' && 'ℹ️ Skipped' || '❌ Failed') || 'ℹ️ Unchanged' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Auto-Fix | ${{ needs.code-auto-fix.result == 'success' && '✅ Success' || needs.code-auto-fix.result == 'skipped' && 'ℹ️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docs Build | ${{ needs.docs-build.result == 'success' && '✅ Success' || needs.docs-build.result == 'skipped' && 'ℹ️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Evaluate workflow outcomes
        id: decide
        env:
          BACKEND_RESULT: ${{ needs.backend-ci.result }}
          FRONTEND_RESULT: ${{ needs.frontend-ci.result }}
          # E2E_RESULT: ${{ needs.e2e.result }}
          CODE_AUTOFIX_RESULT: ${{ needs.code-auto-fix.result }}
          DOCS_RESULT: ${{ needs.docs-build.result }}
          BACKEND_CHANGED: ${{ needs.filter.outputs.backend || 'false' }}
          FRONTEND_CHANGED: ${{ needs.filter.outputs.frontend || 'false' }}
        run: |
          set -euo pipefail

          echo "=== Decision Gate Debug ==="
          echo "BACKEND_CHANGED='$BACKEND_CHANGED'"
          echo "FRONTEND_CHANGED='$FRONTEND_CHANGED'"
          echo "BACKEND_RESULT='$BACKEND_RESULT'"
          echo "FRONTEND_RESULT='$FRONTEND_RESULT'"
          # echo "E2E_RESULT='$E2E_RESULT'"
          echo "CODE_AUTOFIX_RESULT='$CODE_AUTOFIX_RESULT'"
          echo "DOCS_RESULT='$DOCS_RESULT'"

          can_merge=false
          should_deploy=false

          if { [ "$BACKEND_RESULT" = "success" ] || [ "$BACKEND_RESULT" = "skipped" ]; } && \
             { [ "$FRONTEND_RESULT" = "success" ] || [ "$FRONTEND_RESULT" = "skipped" ]; } && \
             # { [ "$E2E_RESULT" = "success" ] || [ "$E2E_RESULT" = "skipped" ]; } && \
             { [ "$CODE_AUTOFIX_RESULT" = "success" ] || [ "$CODE_AUTOFIX_RESULT" = "skipped" ]; } && \
             { [ "$DOCS_RESULT" = "success" ] || [ "$DOCS_RESULT" = "skipped" ]; }; then
            can_merge=true
          fi

          if [ "$can_merge" = "true" ] && \
             { [ "$BACKEND_CHANGED" = "true" ] || [ "$FRONTEND_CHANGED" = "true" ]; }; then
            should_deploy=true
          fi

          echo "can_merge=$can_merge" >> "$GITHUB_OUTPUT"
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          echo "==========================="
          echo "can_merge=$can_merge"
          echo "should_deploy=$should_deploy"

  # ---------------------------------------------------------------
  # Auto-Merge PR
  # ---------------------------------------------------------------
  auto-merge:
    name: Auto-Merge PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [decision-gate]
    if: always() && github.event_name == 'pull_request' && needs.decision-gate.result == 'success' && needs.decision-gate.outputs.can_merge == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch

  # ---------------------------------------------------------------
  # Trigger Deploy
  # ---------------------------------------------------------------
  trigger-deploy:
    name: Trigger Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [decision-gate, auto-merge]
    if: always() && github.event_name == 'pull_request' && needs.decision-gate.result == 'success' && needs.decision-gate.outputs.should_deploy == 'true' && needs.auto-merge.result == 'success'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger Deploy Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Dispatching Deploy Basketball Stats on main..."
          gh workflow run "Deploy Basketball Stats" \
            --repo "${{ github.repository }}" \
            --ref main
          echo "Dispatch complete. Check Actions tab for deploy run."
