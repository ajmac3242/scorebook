name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3
  NODE_NO_WARNINGS: 1

defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  # ---------------------------------------------------------------
  # Path Filtering: Determines what changed
  # ---------------------------------------------------------------
  filter:
    name: Filter Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            docs:
              - 'docs/**'
              - 'infra/**'
              - 'README.md'
              - 'SCHEMA.md'

  # ---------------------------------------------------------------
  # Code Auto-Fix (best-effort: format + fix, never blocks pipeline)
  # ---------------------------------------------------------------
  code-auto-fix:
    name: Code Auto-Fix
    needs: filter
    if: always() && (needs.filter.outputs.backend == 'true' || needs.filter.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: "Backend: Auto-Fix"
        if: needs.filter.outputs.backend == 'true'
        run: |
          echo "::group::Backend Auto-Fix"
          cd backend
          for i in {1..3}; do pnpm install --frozen-lockfile --prefer-offline --reporter=appendonly && break || if [ $i -eq 3 ]; then exit 1; else sleep 10; fi; done
          pnpm exec prettier --write "src/**/*.ts"
          pnpm exec eslint "src/**/*.ts" --config eslint.config.mjs --fix || true
          echo "::endgroup::"

      - name: "Frontend: Auto-Fix"
        if: needs.filter.outputs.frontend == 'true'
        run: |
          echo "::group::Frontend Auto-Fix"
          cd frontend
          for i in {1..3}; do pnpm install --frozen-lockfile --prefer-offline --reporter=appendonly && break || if [ $i -eq 3 ]; then exit 1; else sleep 10; fi; done
          pnpm exec prettier --write "src/**/*.{ts,tsx}"
          pnpm exec eslint "src/**/*.{ts,tsx}" --config eslint.config.js --fix
          echo "::endgroup::"

      - name: Commit Auto-fixes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-format and lint fixes [skip ci]"
          file_pattern: "backend/src/** frontend/src/**"

  # ---------------------------------------------------------------
  # Backend Quality & Tests
  # ---------------------------------------------------------------
  backend-ci:
    name: Backend CI
    needs: [filter, code-auto-fix]
    if: needs.filter.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: "Backend: Install & Build"
        timeout-minutes: 5
        run: |
          echo "::group::Backend Build"
          cd backend
          for i in {1..3}; do pnpm install --frozen-lockfile --prefer-offline --reporter=appendonly && break || if [ $i -eq 3 ]; then exit 1; else sleep 10; fi; done
          pnpm run build
          echo "::endgroup::"

      - name: "Backend: Lint"
        timeout-minutes: 5
        run: |
          echo "::group::Backend Lint"
          cd backend
          pnpm exec eslint "src/**/*.ts" --config eslint.config.mjs
          echo "::endgroup::"

      - name: "Backend: Run Tests"
        timeout-minutes: 5
        run: |
          echo "::group::Backend Tests"
          cd backend
          pnpm test -- --verbose
          echo "::endgroup::"

      - name: Upload Backend Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failure-logs
          path: |
            backend/coverage
            backend/*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Frontend Quality & Tests
  # ---------------------------------------------------------------
  frontend-ci:
    name: Frontend CI
    needs: [filter, code-auto-fix]
    if: needs.filter.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: "Frontend: Install & Build"
        timeout-minutes: 10
        run: |
          echo "::group::Frontend Build"
          cd frontend
          for i in {1..3}; do pnpm install --frozen-lockfile --prefer-offline --reporter=appendonly && break || if [ $i -eq 3 ]; then exit 1; else sleep 10; fi; done
          pnpm run build
          echo "::endgroup::"

      - name: Generate frontend build hash
        timeout-minutes: 5
        run: |
          echo "::group::Generate frontend build hash"
          find frontend/dist -type f | sort | xargs sha256sum | sha256sum | awk '{print $1}' > frontend-build-hash.txt
          echo "::endgroup::"

      - name: "Frontend: Lint"
        timeout-minutes: 5
        run: |
          echo "::group::Frontend Lint"
          cd frontend
          pnpm exec eslint "src/**/*.{ts,tsx}" --config eslint.config.js
          echo "::endgroup::"

      - name: "Frontend: Run Tests with Coverage"
        timeout-minutes: 10
        run: |
          echo "::group::Frontend Tests"
          cd frontend
          pnpm test:coverage
          echo "::endgroup::"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 30

      - name: Post coverage comment
        uses: davelosert/vitest-coverage-report-action@v2
        if: always() && github.event_name == 'pull_request'
        with:
          working-directory: frontend
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

      - name: Upload Frontend Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-failure-logs
          path: |
            frontend/coverage
            frontend/*.log
            frontend-build-hash.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Docs Build
  # ---------------------------------------------------------------
  docs-build:
    name: Docs Build
    needs: filter
    if: needs.filter.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Render terraform-docs
        timeout-minutes: 5
        run: |
          echo "::group::Install terraform-docs"
          curl -sSLo ./terraform-docs.tar.gz "https://github.com/terraform-docs/terraform-docs/releases/download/v0.19.0/terraform-docs-v0.19.0-linux-amd64.tar.gz"
          tar -xzf ./terraform-docs.tar.gz
          chmod +x ./terraform-docs
          mv ./terraform-docs /usr/local/bin/
          rm ./terraform-docs.tar.gz
          echo "::endgroup::"

          echo "::group::Execute terraform-docs"
          terraform-docs markdown table infra --output-file README.md --output-mode inject
          echo "::endgroup::"

      - name: Install Graphviz
        timeout-minutes: 5
        run: |
          echo "::group::Install Graphviz"
          for i in {1..3}; do
            sudo apt-get update -y && sudo apt-get install -y graphviz && break || sleep 5;
          done
          echo "::endgroup::"

      - name: Set up Python
        uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'docs/requirements.txt'

      - name: Install diagram dependencies
        timeout-minutes: 5
        run: |
          echo "::group::Install diagram dependencies"
          pip install -r docs/requirements.txt
          echo "::endgroup::"

      - name: Generate architecture diagram
        timeout-minutes: 5
        run: |
          echo "::group::Generate architecture diagram"
          mkdir -p docs
          cat > /tmp/gen_diagram.py << 'PYEOF'
          from diagrams import Diagram, Cluster, Edge
          from diagrams.aws.network import CloudFront, APIGateway
          from diagrams.aws.storage import S3
          from diagrams.aws.compute import Lambda
          from diagrams.aws.database import Dynamodb
          from diagrams.aws.security import Cognito
          from diagrams.onprem.client import User

          with Diagram(
              "Basketball Stats Notebook - AWS Architecture",
              filename="docs/architecture",
              outformat="png",
              show=False,
              direction="TB",
          ):
              user = User("User / Browser")

              with Cluster("Frontend"):
                  s3_hosting = S3("Hosting\\n(S3)")
                  cf = CloudFront("Delivery\\n(CloudFront)")

              with Cluster("Backend"):
                  apigw = APIGateway("API Gateway\\n(v2)")
                  fn = Lambda("API Handler\\n(Lambda)")
                  db = Dynamodb("Data Store\\n(DynamoDB)")
                  s3_data = S3("Snapshots\\n(S3)")

              with Cluster("Security"):
                  cognito = Cognito("Identity\\n(User Pool)")

              user >> cf >> s3_hosting
              user >> apigw
              user >> cognito
              apigw >> Edge(label="Auth (JWT)") >> cognito
              apigw >> fn
              fn >> db
              fn >> s3_data
              cf >> s3_data
          PYEOF
          python /tmp/gen_diagram.py
          echo "::endgroup::"

      - name: Commit Docs Updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: docs update [skip ci]"
          file_pattern: "infra/README.md docs/architecture.png"

