name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3
  NODE_NO_WARNINGS: 1

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  # ---------------------------------------------------------------
  # Path Filtering: Determines what changed
  # ---------------------------------------------------------------
  filter:
    name: Filter Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            docs:
              - 'docs/**'
              - 'infra/**'

  # ---------------------------------------------------------------
  # Backend Quality & Tests
  # ---------------------------------------------------------------
  backend-ci:
    name: Backend CI
    needs: filter
    if: needs.filter.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: "Backend: Install & Build"
        timeout-minutes: 5
        run: |
          echo "::group::Backend Build"
          cd backend
          for i in {1..3}; do pnpm install --frozen-lockfile --reporter=appendonly && break || if [ $i -eq 3 ]; then exit 1; else sleep 10; fi; done
          pnpm run build
          echo "::endgroup::"

      - name: "Backend: Run Tests"
        timeout-minutes: 5
        run: |
          echo "::group::Backend Tests"
          cd backend
          pnpm test -- --verbose
          echo "::endgroup::"

      - name: Upload Backend Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failure-logs
          path: |
            backend/coverage
            backend/*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Frontend Quality & Tests
  # ---------------------------------------------------------------
  frontend-ci:
    name: Frontend CI
    needs: filter
    if: needs.filter.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: "Frontend: Install & Build"
        timeout-minutes: 5
        run: |
          echo "::group::Frontend Build"
          cd frontend
          for i in {1..3}; do pnpm install --frozen-lockfile --reporter=appendonly && break || if [ $i -eq 3 ]; then exit 1; else sleep 10; fi; done
          pnpm run build
          echo "::endgroup::"

      - name: Generate frontend build hash
        timeout-minutes: 5
        run: |
          echo "::group::Generate frontend build hash"
          find frontend/dist -type f | sort | xargs sha256sum | sha256sum | awk '{print $1}' > frontend-build-hash.txt
          echo "::endgroup::"

      - name: "Frontend: Run Tests"
        timeout-minutes: 5
        run: |
          echo "::group::Frontend Tests"
          cd frontend
          pnpm test -- --reporter=verbose
          echo "::endgroup::"

      - name: Upload Frontend Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-failure-logs
          path: |
            frontend/coverage
            frontend/*.log
            frontend-build-hash.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Documentation, Diagrams & Auto-Fix Commits
  # ---------------------------------------------------------------
    docs-and-auto-fix:
    name: Docs & Auto-Fix
    needs: filter
    if: always() && (needs.filter.outputs.backend == 'true' || needs.filter.outputs.frontend == 'true' || needs.filter.outputs.docs == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      # --- Backend Auto-Fix ---
      - name: "Backend: Auto-Fix"
        if: needs.filter.outputs.backend == 'true'
        run: |
          echo "::group::Backend Auto-Fix"
          cd backend
          for i in {1..3}; do pnpm install --frozen-lockfile --reporter=appendonly && break || if [ $i -eq 3 ]; then exit 1; else sleep 10; fi; done
          pnpm exec prettier --write "src/**/*.ts"
          pnpm exec eslint "src/**/*.ts" --config eslint.config.mjs --fix --rule '{"jsdoc/require-jsdoc": ["warn", {"enableFixer": true, "require": {"FunctionDeclaration": true, "FunctionExpression": true, "MethodDefinition": true}}]}'
          echo "::endgroup::"

      # --- Frontend Auto-Fix ---
      - name: "Frontend: Auto-Fix"
        if: needs.filter.outputs.frontend == 'true'
        run: |
          echo "::group::Frontend Auto-Fix"
          cd frontend
          for i in {1..3}; do pnpm install --frozen-lockfile --reporter=appendonly && break || if [ $i -eq 3 ]; then exit 1; else sleep 10; fi; done
          pnpm exec prettier --write "src/**/*.{ts,tsx}"
          pnpm exec eslint "src/**/*.{ts,tsx}" --config eslint.config.js --fix --rule '{"jsdoc/require-jsdoc": ["warn", {"enableFixer": true, "require": {"FunctionDeclaration": true, "FunctionExpression": true, "MethodDefinition": true}}]}'
          echo "::endgroup::"

      # --- Documentation & Diagrams ---
      - name: Render terraform-docs
        if: needs.filter.outputs.docs == 'true'
        uses: terraform-docs/gh-actions@v1.3.0
        timeout-minutes: 5
        with:
          working-dir: infra
          output-file: README.md
          output-method: inject
          git-push: "false"

      - name: Install Graphviz
        if: needs.filter.outputs.docs == 'true'
        timeout-minutes: 5
        run: |
          echo "::group::Install Graphviz"
          for i in {1..3}; do
            sudo apt-get update -y && sudo apt-get install -y graphviz && break || sleep 5;
          done
          echo "::endgroup::"

      - name: Set up Python
        if: needs.filter.outputs.docs == 'true'
        uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'docs/requirements.txt'

      - name: Install diagram dependencies
        if: needs.filter.outputs.docs == 'true'
        timeout-minutes: 5
        run: |
          echo "::group::Install diagram dependencies"
          pip install -r docs/requirements.txt
          echo "::endgroup::"

      - name: Generate architecture diagram
        if: needs.filter.outputs.docs == 'true'
        timeout-minutes: 5
        run: |
          echo "::group::Generate architecture diagram"
          mkdir -p docs
          cat > /tmp/gen_diagram.py << 'PYEOF'
          from diagrams import Diagram, Cluster, Edge
          from diagrams.aws.network import CloudFront, APIGateway
          from diagrams.aws.storage import S3
          from diagrams.aws.compute import Lambda
          from diagrams.aws.database import Dynamodb
          from diagrams.aws.security import Cognito
          from diagrams.onprem.client import User

          with Diagram(
              "Basketball Stats Notebook - AWS Architecture",
              filename="docs/architecture",
              outformat="png",
              show=False,
              direction="TB",
          ):
              user = User("User / Browser")

              with Cluster("Frontend"):
                  s3_hosting = S3("Hosting\n(S3)")
                  cf = CloudFront("Delivery\n(CloudFront)")

              with Cluster("Backend"):
                  apigw = APIGateway("API Gateway\n(v2)")
                  fn = Lambda("API Handler\n(Lambda)")
                  db = Dynamodb("Data Store\n(DynamoDB)")
                  s3_data = S3("Snapshots\n(S3)")

              with Cluster("Security"):
                  cognito = Cognito("Identity\n(User Pool)")

              user >> cf >> s3_hosting
              user >> apigw
              user >> cognito
              apigw >> Edge(label="Auth (JWT)") >> cognito
              apigw >> fn
              fn >> db
              fn >> s3_data
              cf >> s3_data
          PYEOF
          python /tmp/gen_diagram.py
          echo "::endgroup::"

      # --- Unified Commit ---
      - name: Commit Auto-fixes and Docs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-format, JSDoc stubs, and docs update"
          file_pattern: "backend/src/** frontend/src/** infra/README.md docs/architecture.png"

  # ---------------------------------------------------------------
  # Summary Job: Provides a consolidated view of the run
  # ---------------------------------------------------------------
    summary:
    name: Job Summary
    needs: [filter, backend-ci, frontend-ci, docs-and-auto-fix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Job Summary
        run: |
          echo "### CI Run Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.filter.outputs.backend == 'true' && (needs.backend-ci.result == 'success' && '✅ Success' || '❌ Failed') || 'ℹ️ Unchanged' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.filter.outputs.frontend == 'true' && (needs.frontend-ci.result == 'success' && '✅ Success' || '❌ Failed') || 'ℹ️ Unchanged' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docs & Fixes | ${{ needs.docs-and-auto-fix.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------
  # Auto-Merge: Only runs if parallel jobs pass
  # ---------------------------------------------------------------
    auto-merge:
    name: Auto-Merge PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-ci, frontend-ci, docs-and-auto-fix]
      if: |
    github.event_name == 'pull_request' &&
    (needs.backend-ci.result == 'success' || needs.backend-ci.result == 'skipped') &&
    (needs.frontend-ci.result == 'success' || needs.frontend-ci.result == 'skipped') &&
    (needs.docs-and-auto-fix.result == 'success' || needs.docs-and-auto-fix.result == 'skipped')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch \
            --subject "chore: merge ${{ github.head_ref }} into main [skip ci]"

  # ---------------------------------------------------------------
  # Trigger Deploy: Fires after successful auto-merge to main
  # ---------------------------------------------------------------
  trigger-deploy:
    name: Trigger Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: auto-merge
    if: github.event_name == 'pull_request'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger Deploy Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Deploy Basketball Stats" \
            --repo "${{ github.repository }}" \
            --ref main
