name: Deploy Basketball Stats
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting the JWT
  contents: read  # Required for actions/checkout

jobs:
  # ---------------------------------------------------------------
  # Job 0a: Test backend — must pass before anything else runs
  # ---------------------------------------------------------------
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd backend && npm install

      - name: Run tests
        run: cd backend && npm test

  # ---------------------------------------------------------------
  # Job 0b: Test frontend — must pass before anything else runs
  # ---------------------------------------------------------------
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd frontend && npm install

      - name: Run tests
        run: cd frontend && npm test

  # ---------------------------------------------------------------
  # Job 1a: Build backend and produce lambda.zip artifact
  # ---------------------------------------------------------------
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: |
          cd backend
          npm install --production
          npm install --save-dev typescript @types/node
          npm run build
          zip -r ../lambda.zip dist node_modules

      - name: Upload lambda.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: lambda.zip
          retention-days: 1

  # ---------------------------------------------------------------
  # Job 2: Terraform — runs AFTER build completes
  # - Deploys infrastructure
  # - Builds frontend with Terraform outputs
  # - Syncs frontend to S3
  # ---------------------------------------------------------------
  infra:
    name: Terraform
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Download lambda.zip artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip
          # downloads to repo root so infra/main.tf can reference ../lambda.zip

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: cd infra && terraform init

      - name: Terraform Apply (Initial)
        # Create/Update infrastructure (Cognito, etc.)
        run: cd infra && terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          cd infra
          echo "VITE_USER_POOL_ID=$(terraform output -raw user_pool_id)" >> $GITHUB_ENV
          echo "VITE_CLIENT_ID=$(terraform output -raw user_pool_client_id)" >> $GITHUB_ENV
          echo "VITE_API_ENDPOINT=$(terraform output -raw api_endpoint)" >> $GITHUB_ENV

      - name: Setup Node for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
        env:
          VITE_USER_POOL_ID: ${{ env.VITE_USER_POOL_ID }}
          VITE_CLIENT_ID: ${{ env.VITE_CLIENT_ID }}
          VITE_API_ENDPOINT: ${{ env.VITE_API_ENDPOINT }}

      - name: Generate frontend build hash
        run: find frontend/dist -type f | sort | xargs sha256sum | sha256sum | awk '{print $1}' > frontend-build-hash.txt

      - name: Terraform Apply (Final)
        # Trigger null_resource.frontend_deploy to sync the new build
        run: cd infra && terraform apply -auto-approve
