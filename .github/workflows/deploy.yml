name: Deploy Basketball Stats

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3
  NODE_NO_WARNINGS: 1
  TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Deployment - only runs if CI passed on main or if manually triggered
  # ---------------------------------------------------------------
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Build Backend
        timeout-minutes: 10
        run: |
          echo "::group::Backend Build"
          cd backend
          for i in {1..3}; do pnpm install --frozen-lockfile --prefer-offline --reporter=appendonly && break || if [ $i -eq 3 ]; then exit 1; else sleep 10; fi; done
          pnpm run build
          for i in {1..3}; do pnpm install --prod --shamefully-hoist --prefer-offline --reporter=appendonly && break || if [ $i -eq 3 ]; then exit 1; else sleep 10; fi; done
          node scripts/verify-build.cjs
          zip -r ../lambda.zip dist node_modules package.json
          echo "::endgroup::"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        timeout-minutes: 5
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        timeout-minutes: 5
        with:
          terraform_wrapper: false

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('infra/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-

      - name: Prepare Terraform plugin cache
        run: mkdir -p ~/.terraform.d/plugin-cache

      - name: Terraform Init
        timeout-minutes: 5
        run: |
          echo "::group::Terraform Init"
          cd infra && terraform init
          echo "::endgroup::"

      - name: Force Unlock Stale Terraform State
        timeout-minutes: 5
        run: |
          echo "::group::Force Unlock Stale Terraform State"
          aws dynamodb delete-item \
            --table-name basketball-stats-terraform-lock \
            --key '{"LockID": {"S": "basketball-stats-terraform-state-269555264437/terraform.tfstate"}}' \
            --region us-east-1 || true
          echo "::endgroup::"

      - name: Terraform Plan
        timeout-minutes: 5
        run: |
          echo "::group::Terraform Plan"
          cd infra && terraform plan -out=tfplan
          echo "::endgroup::"

      - name: Terraform Apply (Initial)
        timeout-minutes: 5
        run: |
          echo "::group::Terraform Apply (Initial)"
          cd infra && terraform apply -auto-approve tfplan
          echo "::endgroup::"

      - name: Get Terraform Outputs
        id: tf_outputs
        timeout-minutes: 5
        run: |
          echo "::group::Get Terraform Outputs"
          cd infra
          echo "VITE_USER_POOL_ID=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_ENV
          echo "VITE_CLIENT_ID=$(terraform output -raw cognito_client_id)" >> $GITHUB_ENV
          echo "VITE_API_ENDPOINT=$(terraform output -raw api_endpoint)" >> $GITHUB_ENV
          echo "::endgroup::"

      - name: Build Frontend
        timeout-minutes: 10
        env:
          VITE_USER_POOL_ID: ${{ env.VITE_USER_POOL_ID }}
          VITE_CLIENT_ID: ${{ env.VITE_CLIENT_ID }}
          VITE_API_ENDPOINT: ${{ env.VITE_API_ENDPOINT }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "::group::Frontend Build"
          cd frontend
          for i in {1..3}; do pnpm install --frozen-lockfile --prefer-offline --reporter=appendonly && break || if [ $i -eq 3 ]; then exit 1; else sleep 10; fi; done
          pnpm run build
          echo "::endgroup::"

      - name: Generate frontend build hash
        timeout-minutes: 5
        run: |
          echo "::group::Generate frontend build hash"
          find frontend/dist -type f | sort | xargs sha256sum | sha256sum | awk '{print $1}' > frontend-build-hash.txt
          echo "::endgroup::"

      - name: Terraform Apply (Final)
        timeout-minutes: 5
        run: |
          echo "::group::Terraform Apply (Final)"
          cd infra && terraform apply -auto-approve
          echo "::endgroup::"

      - name: Deployment Summary
        if: always()
        timeout-minutes: 5
        env:
          VITE_USER_POOL_ID: ${{ env.VITE_USER_POOL_ID }}
          VITE_CLIENT_ID: ${{ env.VITE_CLIENT_ID }}
          VITE_API_ENDPOINT: ${{ env.VITE_API_ENDPOINT }}
        run: |
          echo "::group::Deployment Summary"
          echo "### Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Infrastructure deployed successfully." >> $GITHUB_STEP_SUMMARY
          echo "- **User Pool ID:** \`${VITE_USER_POOL_ID}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Client ID:** \`${VITE_CLIENT_ID}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API Endpoint:** \`${VITE_API_ENDPOINT}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status == 'success' && '🟢 Success' || '🔴 Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "::endgroup::"

      - name: Upload Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-failure-logs
          path: |
            backend/*.log
            frontend/*.log
            infra/*.log
            infra/tfplan
            frontend-build-hash.txt
          if-no-files-found: ignore
