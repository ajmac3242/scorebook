name: Deploy Basketball Stats
on:
  workflow_dispatch:  # Now called explicitly by CI, or manually

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Deployment - only runs if CI passed on main or if manually triggered
  # ---------------------------------------------------------------
  deploy:
    name: Build & Deploy
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Build Backend
        timeout-minutes: 5
        run: |
          echo "::group::Backend Build"
          cd backend
          for i in {1..3}; do pnpm install --frozen-lockfile && break || if [ $i -eq 3 ]; then exit 1; else sleep 10; fi; done
          pnpm run build
          # Use --prefer-offline for the second install as most packages are already in store
          for i in {1..3}; do pnpm install --prod --shamefully-hoist --prefer-offline && break || if [ $i -eq 3 ]; then exit 1; else sleep 10; fi; done
          node scripts/verify-build.cjs
          zip -r ../lambda.zip dist node_modules package.json
          echo "::endgroup::"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - uses: hashicorp/setup-terraform@v3
        timeout-minutes: 5
        with:
          terraform_wrapper: false

      - name: Cache Terraform Providers
        uses: actions/cache@v4
        with:
          path: infra/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/versions.tf', 'infra/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        timeout-minutes: 5
        run: |
          echo "::group::Terraform Init"
          cd infra && terraform init
          echo "::endgroup::"

      - name: Force Unlock Stale Terraform State
        timeout-minutes: 5
        run: |
          echo "::group::Force Unlock Stale Terraform State"
          aws dynamodb delete-item \
            --table-name basketball-stats-terraform-lock \
            --key '{"LockID": {"S": "basketball-stats-terraform-state-269555264437/terraform.tfstate"}}' \
            --region us-east-1 || true
          echo "::endgroup::"

      - name: Terraform Plan
        timeout-minutes: 5
        run: |
          echo "::group::Terraform Plan"
          cd infra && terraform plan -out=tfplan
          echo "::endgroup::"

      - name: Terraform Apply (Initial)
        timeout-minutes: 5
        # Create/Update infrastructure (Cognito, Lambda, API Gateway, etc.)
        run: |
          echo "::group::Terraform Apply (Initial)"
          cd infra && terraform apply -auto-approve tfplan
          echo "::endgroup::"

      - name: Get Terraform Outputs
        id: tf_outputs
        timeout-minutes: 5
        run: |
          echo "::group::Get Terraform Outputs"
          cd infra
          echo "VITE_USER_POOL_ID=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_ENV
          echo "VITE_CLIENT_ID=$(terraform output -raw cognito_client_id)" >> $GITHUB_ENV
          echo "VITE_API_ENDPOINT=$(terraform output -raw api_endpoint)" >> $GITHUB_ENV
          echo "::endgroup::"

      - name: Build Frontend
        timeout-minutes: 5
        # Bakes live Cognito IDs and API endpoint into the React build
        run: |
          echo "::group::Frontend Build"
          cd frontend
          for i in {1..3}; do pnpm install --frozen-lockfile --prefer-offline && break || if [ $i -eq 3 ]; then exit 1; else sleep 10; fi; done
          pnpm run build
          echo "::endgroup::"
        env:
          VITE_USER_POOL_ID: ${{ env.VITE_USER_POOL_ID }}
          VITE_CLIENT_ID: ${{ env.VITE_CLIENT_ID }}
          VITE_API_ENDPOINT: ${{ env.VITE_API_ENDPOINT }}

      - name: Generate frontend build hash
        run: find frontend/dist -type f | sort | xargs sha256sum | sha256sum | awk '{print $1}' > frontend-build-hash.txt

      - name: Terraform Apply (Final)
        timeout-minutes: 5
        # Triggers null_resource.frontend_deploy to sync new build to S3 and invalidate CloudFront
        run: |
          echo "::group::Terraform Apply (Final)"
          cd infra && terraform apply -auto-approve
          echo "::endgroup::"

      - name: Deployment Summary
        if: always()
        run: |
          echo "::group::Deployment Summary"
          echo "### Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Infrastructure deployed successfully." >> $GITHUB_STEP_SUMMARY
          echo "- **User Pool ID:** \`${VITE_USER_POOL_ID}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Client ID:** \`${VITE_CLIENT_ID}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API Endpoint:** \`${VITE_API_ENDPOINT}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status == 'success' && '🟢 Success' || '🔴 Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "::endgroup::"
        env:
          VITE_USER_POOL_ID: ${{ env.VITE_USER_POOL_ID }}
          VITE_CLIENT_ID: ${{ env.VITE_CLIENT_ID }}
          VITE_API_ENDPOINT: ${{ env.VITE_API_ENDPOINT }}

      - name: Upload Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-failure-logs
          path: |
            backend/*.log
            frontend/*.log
            infra/tfplan
            lambda.zip
            frontend-build-hash.txt
          if-no-files-found: ignore
