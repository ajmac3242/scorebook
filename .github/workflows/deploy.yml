name: Deploy Basketball Stats

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Job 1: Build backend and produce lambda.zip artifact
  # ---------------------------------------------------------------
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm prune --production
          zip -r ../lambda.zip dist node_modules

      - name: Upload lambda.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: lambda.zip
          retention-days: 1

  # ---------------------------------------------------------------
  # Job 2: Apply Infrastructure Base layer (Stateful Resources)
  # ---------------------------------------------------------------
  infra-base:
    name: Infrastructure (Base)
    runs-on: ubuntu-latest
    outputs:
      user_pool_id: ${{ steps.tf_outputs.outputs.user_pool_id }}
      user_pool_client_id: ${{ steps.tf_outputs.outputs.user_pool_client_id }}
      api_endpoint: ${{ steps.tf_outputs.outputs.api_endpoint }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/base
        run: terraform init

      - name: Terraform Apply
        working-directory: infra/base
        run: terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: tf_outputs
        working-directory: infra/base
        run: |
          echo "user_pool_id=$(terraform output -raw user_pool_id)" >> $GITHUB_OUTPUT
          echo "user_pool_client_id=$(terraform output -raw user_pool_client_id)" >> $GITHUB_OUTPUT
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------
  # Job 3: Build Frontend (using outputs from infra-base)
  # ---------------------------------------------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [infra-base]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_USER_POOL_ID: ${{ needs.infra-base.outputs.user_pool_id }}
          VITE_CLIENT_ID: ${{ needs.infra-base.outputs.user_pool_client_id }}
          VITE_API_ENDPOINT: ${{ needs.infra-base.outputs.api_endpoint }}

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ---------------------------------------------------------------
  # Job 4: Apply Infrastructure App layer (Stateless/Deployable Resources)
  # ---------------------------------------------------------------
  infra-app:
    name: Infrastructure (App)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    outputs:
      s3_bucket_name: ${{ steps.tf_outputs.outputs.s3_bucket_name }}
      cloudfront_distribution_id: ${{ steps.tf_outputs.outputs.cloudfront_distribution_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Download lambda.zip artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip
          path: .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/app
        run: terraform init

      - name: Terraform Apply
        working-directory: infra/app
        run: terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: tf_outputs
        working-directory: infra/app
        run: |
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------
  # Job 5: Sync Frontend and Invalidate CloudFront
  # ---------------------------------------------------------------
  sync-frontend:
    name: Sync Frontend
    runs-on: ubuntu-latest
    needs: [infra-app, build-frontend]
    steps:
      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Sync S3
        run: |
          aws s3 sync dist/ s3://${{ needs.infra-app.outputs.s3_bucket_name }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ needs.infra-app.outputs.cloudfront_distribution_id }} --paths "/*"
