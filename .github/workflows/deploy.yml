name: Deploy Basketball Stats

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting the JWT
  contents: read  # Required for actions/checkout

jobs:
  infra:
    name: Terraform
    runs-on: ubuntu-latest
    outputs:
      s3_bucket_name: ${{ steps.outputs.outputs.s3_bucket_name }}
      api_endpoint: ${{ steps.outputs.outputs.api_endpoint }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          # Explicitly set the audience to match your AWS config
          audience: sts.amazonaws.com
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false
      - name: Terraform Init
        run: cd infra && terraform init
      - name: Terraform Apply
        run: cd infra && terraform apply -auto-approve
      - name: Capture Outputs
        id: outputs
        run: |
          cd infra
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT

  backend:
    name: Build & Deploy Backend
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          # Explicitly set the audience to match your AWS config
          audience: sts.amazonaws.com
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Build
        run: |
          cd backend
          npm install --production
          npm install --save-dev typescript @types/node
          npm run build
          zip -r lambda.zip dist node_modules
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code --function-name basketball-stats-api-handler --zip-file fileb://backend/lambda.zip

  frontend:
    name: Build & Deploy Frontend
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          # Explicitly set the audience to match your AWS config
          audience: sts.amazonaws.com
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Build
        run: |
          cd frontend
          npm install
          VITE_API_ENDPOINT=${{ needs.infra.outputs.api_endpoint }} npm run build
      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ needs.infra.outputs.s3_bucket_name }} --delete
