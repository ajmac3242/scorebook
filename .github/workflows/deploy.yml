name: Deploy Basketball Stats

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting the JWT
  contents: read  # Required for actions/checkout

jobs:

  # ---------------------------------------------------------------
  # Job 1a: Build backend and produce lambda.zip artifact
  # ---------------------------------------------------------------
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: |
          cd backend
          npm install --production
          npm install --save-dev typescript @types/node
          npm run build
          zip -r ../lambda.zip dist node_modules

      - name: Upload lambda.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: lambda.zip
          retention-days: 1

  # ---------------------------------------------------------------
  # Job 1b: Build frontend artifact (no AWS needed yet)
  # ---------------------------------------------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build with a placeholder endpoint; real endpoint injected at deploy time
      - name: Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ---------------------------------------------------------------
  # Job 2: Terraform — runs AFTER both builds complete
  #   Downloads lambda.zip so Terraform apply deploys real code
  # ---------------------------------------------------------------
  infra:
    name: Terraform
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    outputs:
      s3_bucket_name: ${{ steps.outputs.outputs.s3_bucket_name }}
      api_endpoint: ${{ steps.outputs.outputs.api_endpoint }}
    steps:
      - uses: actions/checkout@v4

      - name: Download lambda.zip artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip
          # downloads to repo root so infra/main.tf can reference ../lambda.zip

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: cd infra && terraform init

      - name: Terraform Apply
        run: cd infra && terraform apply -auto-approve

      - name: Capture Outputs
        id: outputs
        run: |
          cd infra
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------
  # Job 3a: Deploy backend — update Lambda with the built zip
  # ---------------------------------------------------------------
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - name: Download lambda.zip artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name basketball-stats-api-handler \
            --zip-file fileb://lambda.zip

  # ---------------------------------------------------------------
  # Job 3b: Deploy frontend — inject real API endpoint then sync to S3
  # ---------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild frontend with real API endpoint
        run: |
          cd frontend
          npm install
          VITE_API_ENDPOINT=${{ needs.infra.outputs.api_endpoint }} npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ needs.infra.outputs.s3_bucket_name }} --delete
