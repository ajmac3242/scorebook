name: Deploy Basketball Stats
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Job 1: Build backend and produce lambda.zip artifact
  # ---------------------------------------------------------------
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build
        run: |
          cd backend
          npm ci
          npm run build
          npm prune --production
          zip -r ../lambda.zip dist node_modules package.json

      - name: Upload lambda.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: lambda.zip
          retention-days: 1

  # ---------------------------------------------------------------
  # Job 2: Terraform - runs AFTER backend build
  # - Initial apply deploys infrastructure (Cognito, API GW, Lambda)
  # - Reads Terraform outputs to inject real Cognito IDs into frontend
  # - Builds frontend with live env vars baked in
  # - Final apply syncs frontend to S3 and invalidates CloudFront
  # ---------------------------------------------------------------
  infra:
    name: Terraform
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Download lambda.zip artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip
          # downloads to repo root so infra/main.tf can reference ../lambda.zip

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: cd infra && terraform init

      - name: Force Unlock Stale Terraform State
        run: |
          aws dynamodb delete-item \
            --table-name basketball-stats-terraform-lock \
            --key '{"LockID": {"S": "basketball-stats-terraform-state-269555264437/terraform.tfstate"}}' \
            --region us-east-1 || true

      - name: Terraform Plan
        run: cd infra && terraform plan -out=tfplan

      - name: Terraform Apply (Initial)
        # Create/Update infrastructure (Cognito, Lambda, API Gateway, etc.)
        run: cd infra && terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          cd infra
          echo "VITE_USER_POOL_ID=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_ENV
          echo "VITE_CLIENT_ID=$(terraform output -raw cognito_client_id)" >> $GITHUB_ENV
          echo "VITE_API_ENDPOINT=$(terraform output -raw api_endpoint)" >> $GITHUB_ENV

      - name: Setup Node for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        # Bakes live Cognito IDs and API endpoint into the React build
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_USER_POOL_ID: ${{ env.VITE_USER_POOL_ID }}
          VITE_CLIENT_ID: ${{ env.VITE_CLIENT_ID }}
          VITE_API_ENDPOINT: ${{ env.VITE_API_ENDPOINT }}

      - name: Generate frontend build hash
        run: find frontend/dist -type f | sort | xargs sha256sum | sha256sum | awk '{print $1}' > frontend-build-hash.txt

      - name: Terraform Apply (Final)
        # Triggers null_resource.frontend_deploy to sync new build to S3 and invalidate CloudFront
        run: cd infra && terraform apply -auto-approve
