name: Deploy Basketball Stats
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting the JWT
  contents: read  # Required for actions/checkout

jobs:
  # ---------------------------------------------------------------
  # Job 0a: Test backend — must pass before anything else runs
  # ---------------------------------------------------------------
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd backend && npm install

      - name: Run tests
        run: cd backend && npm test

  # ---------------------------------------------------------------
  # Job 0b: Test frontend — must pass before anything else runs
  # ---------------------------------------------------------------
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd frontend && npm install

      - name: Run tests
        run: cd frontend && npm test

  # ---------------------------------------------------------------
  # Job 1a: Build backend and produce lambda.zip artifact
  # ---------------------------------------------------------------
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: |
          cd backend
          npm install --production
          npm install --save-dev typescript @types/node
          npm run build
          zip -r ../lambda.zip dist node_modules

      - name: Upload lambda.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: lambda.zip
          retention-days: 1

  # ---------------------------------------------------------------
  # Job 1b: Build frontend — inject real API endpoint at build time
  # The API endpoint comes from Terraform outputs in a subsequent run,
  # so we use VITE_API_ENDPOINT from a prior-run cache or env var.
  # ---------------------------------------------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Generate frontend build hash
        # Hash of all built files — used by Terraform null_resource trigger
        # to detect when frontend content has changed and invalidation is needed
        run: find frontend/dist -type f | sort | xargs sha256sum | sha256sum | awk '{print $1}' > frontend-build-hash.txt

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            frontend/dist/
            frontend-build-hash.txt
          retention-days: 1

  # ---------------------------------------------------------------
  # Job 2: Terraform — runs AFTER both builds complete
  # - Downloads lambda.zip → Terraform detects code change via source_code_hash
  # - Downloads frontend/dist → null_resource syncs to S3 and invalidates CloudFront
  # ---------------------------------------------------------------
  infra:
    name: Terraform
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Download lambda.zip artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip
          # downloads to repo root so infra/main.tf can reference ../lambda.zip

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          # downloads frontend/dist/ and frontend-build-hash.txt to repo root

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: cd infra && terraform init

      - name: Terraform Apply
        # Terraform will:
        # 1. Update Lambda if source_code_hash changed (new lambda.zip)
        # 2. Sync frontend/dist to S3 and invalidate CloudFront if build hash changed
        run: cd infra && terraform apply -auto-approve
