name: PR Quality Checks
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
permissions:
  contents: write # needed to push formatting + comment fixes
  pull-requests: write # needed to post PR comments
jobs:
  # ---------------------------------------------------------------
  # Job 1: Lint & format backend (Prettier + ESLint + JSDoc checks)
  # ---------------------------------------------------------------
  lint-backend:
    name: Lint & Format Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          cd backend
          npm install
          npm install --save-dev prettier eslint @typescript-eslint/eslint-plugin @typescript-eslint/parser eslint-plugin-jsdoc
      - name: Run Prettier (auto-format)
        run: |
          cd backend
          npx prettier --write "src/**/*.ts"
      - name: Write ESLint config with JSDoc rules
        run: |
          cat > backend/eslint.config.mjs << 'ESLINTEOF'
          import tsPlugin from "@typescript-eslint/eslint-plugin";
          import tsParser from "@typescript-eslint/parser";
          import jsdocPlugin from "eslint-plugin-jsdoc";
          export default [
            {
              files: ["src/**/*.ts"],
              ignores: ["src/__tests__/**"],
              languageOptions: {
                parser: tsParser,
                parserOptions: { project: "./tsconfig.json" }
              },
              plugins: {
                "@typescript-eslint": tsPlugin,
                jsdoc: jsdocPlugin
              },
              rules: {
                // JSDoc comment enforcement
                "jsdoc/require-jsdoc": ["warn", {
                  require: {
                    FunctionDeclaration: true,
                    MethodDefinition: true,
                    ClassDeclaration: true,
                    ArrowFunctionExpression: false,
                    FunctionExpression: true
                  },
                  publicOnly: false,
                  checkConstructors: true
                }],
                "jsdoc/require-description": ["warn", { descriptionStyle: "body" }],
                "jsdoc/require-param": "warn",
                "jsdoc/require-param-description": "warn",
                "jsdoc/require-returns": "warn",
                "jsdoc/require-returns-description": "warn",
                "jsdoc/valid-types": "warn",
                "jsdoc/check-alignment": "warn",
                "jsdoc/check-param-names": "warn",
                // General TS rules
                "@typescript-eslint/no-explicit-any": "warn"
              }
            }
          ];
          ESLINTEOF
      - name: Run ESLint (lint + JSDoc check)
        id: backend-eslint
        run: |
          cd backend
          output=$(npx eslint "src/**/*.ts" --format compact 2>&1 || true)
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Auto-add missing JSDoc stubs
        run: |
          cd backend
          # Use eslint --fix-type suggestion to insert missing JSDoc where possible
          npx eslint "src/**/*.ts" --fix --rule '{"jsdoc/require-jsdoc": ["warn", {"enableFixer": true, "require": {"FunctionDeclaration": true, "FunctionExpression": true, "MethodDefinition": true}}]}' 2>/dev/null || true
      - name: Commit formatting + JSDoc fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(backend): auto-format with Prettier and add missing JSDoc stubs"
          file_pattern: "backend/src/**"
          push_options: '--force-with-lease'
  # ---------------------------------------------------------------
  # Job 2: Lint & format frontend (Prettier + ESLint + JSDoc checks)
  # ---------------------------------------------------------------
  lint-frontend:
    name: Lint & Format Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          cd frontend
          npm install
          npm install --save-dev prettier eslint-plugin-jsdoc
      - name: Run Prettier (auto-format)
        run: |
          cd frontend
          npx prettier --write "src/**/*.{ts,tsx}"
      - name: Write ESLint config with JSDoc rules
        run: |
          cat > frontend/eslint.config.mjs << 'ESLINTEOF'
          import js from "@eslint/js";
          import tsPlugin from "@typescript-eslint/eslint-plugin";
          import tsParser from "@typescript-eslint/parser";
          import reactHooks from "eslint-plugin-react-hooks";
          import reactRefresh from "eslint-plugin-react-refresh";
          import jsdocPlugin from "eslint-plugin-jsdoc";
          import globals from "globals";
          export default [
            { ignores: ["dist", "src/__tests__/**"] },
            {
              files: ["src/**/*.{ts,tsx}"],
              languageOptions: {
                ecmaVersion: 2020,
                globals: globals.browser,
                parser: tsParser
              },
              plugins: {
                "@typescript-eslint": tsPlugin,
                "react-hooks": reactHooks,
                "react-refresh": reactRefresh,
                jsdoc: jsdocPlugin
              },
              rules: {
                ...reactHooks.configs.recommended.rules,
                "react-refresh/only-export-components": ["warn", { allowConstantExport: true }],
                // JSDoc enforcement for frontend components and functions
                "jsdoc/require-jsdoc": ["warn", {
                  require: {
                    FunctionDeclaration: true,
                    MethodDefinition: true,
                    ClassDeclaration: true,
                    ArrowFunctionExpression: false,
                    FunctionExpression: false
                  },
                  publicOnly: false,
                  contexts: [
                    "ExportDefaultDeclaration > ArrowFunctionExpression",
                    "ExportNamedDeclaration > VariableDeclaration > VariableDeclarator > ArrowFunctionExpression"
                  ]
                }],
                "jsdoc/require-description": "warn",
                "jsdoc/require-param": "warn",
                "jsdoc/require-param-description": "warn",
                "jsdoc/require-returns": "warn",
                "jsdoc/check-alignment": "warn",
                "jsdoc/check-param-names": "warn",
                "@typescript-eslint/no-explicit-any": "warn"
              }
            }
          ];
          ESLINTEOF
      - name: Run ESLint (lint + JSDoc check)
        id: frontend-eslint
        run: |
          cd frontend
          output=$(npx eslint "src/**/*.{ts,tsx}" --format compact 2>&1 || true)
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Auto-add missing JSDoc stubs
        run: |
          cd frontend
          npx eslint "src/**/*.{ts,tsx}" --fix --rule '{"jsdoc/require-jsdoc": ["warn", {"enableFixer": true, "require": {"FunctionDeclaration": true, "FunctionExpression": true, "MethodDefinition": true}}]}' 2>/dev/null || true
      - name: Commit formatting + JSDoc fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(frontend): auto-format with Prettier and add missing JSDoc stubs"
          file_pattern: "frontend/src/**"
          push_options: '--force-with-lease'
  # ---------------------------------------------------------------
  # Job 3: Comment quality audit — scan all changed files for
  # missing/thin comments and report in a sticky PR comment
  # ---------------------------------------------------------------
  comment-audit:
    name: Comment Quality Audit
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audit tools
        run: |
          cd backend && npm install && npm install --save-dev eslint-plugin-jsdoc @typescript-eslint/eslint-plugin @typescript-eslint/parser
          cd ../frontend && npm install && npm install --save-dev eslint-plugin-jsdoc
              - name: Write backend ESLint config with JSDoc rules
                    run: |
                            cat > backend/eslint.config.mjs << 'ESLINTEOF'
                                    import tsPlugin from "@typescript-eslint/eslint-plugin";
                                            import tsParser from "@typescript-eslint/parser";
                                                    import jsdocPlugin from "eslint-plugin-jsdoc";
                                                            export default [
                                                                      {
                                                                                  files: ["src/**/*.ts"],
                                                                                              ignores: ["src/__tests__/**"],
                                                                                                          languageOptions: {
                                                                                                                        parser: tsParser,
                                                                                                                                      parserOptions: { project: "./tsconfig.json" }
                                                                                                                                                  },
                                                                                                                                                              plugins: {
                                                                                                                                                                            "@typescript-eslint": tsPlugin,
                                                                                                                                                                                          jsdoc: jsdocPlugin
                                                                                                                                                                                                      },
                                                                                                                                                                                                                  rules: {
                                                                                                                                                                                                                                "jsdoc/require-jsdoc": ["warn", {
                                                                                                                                                                                                                                                require: {
                                                                                                                                                                                                                                                                  FunctionDeclaration: true,
                                                                                                                                                                                                                                                                                    MethodDefinition: true,
                                                                                                                                                                                                                                                                                                      ClassDeclaration: true,
                                                                                                                                                                                                                                                                                                                        FunctionExpression: true
                                                                                                                                                                                                                                                                                                                                        },
                                                                                                                                                                                                                                                                                                                                                        enableFixer: false
                                                                                                                                                                                                                                                                                                                                                                      }],
                                                                                                                                                                                                                                                                                                                                                                                    "jsdoc/require-description": ["warn", { descriptionStyle: "body" }]
                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                  ];
                                                                                                                                                                                                                                                                                                                                                                                                                          ESLINTEOF
      - name: Audit backend JSDoc coverage
        id: backend-audit
        run: |
          cd backend
          # Count total exported symbols
          total=$(grep -rE "^(export (async )?function|export (default )?class|export const [a-zA-Z]+ = (async )?(function|\.{3}|\()" src --include="*.ts" | grep -v __tests__ | wc -l | tr -d ' ')
          output=$(npx eslint "src/**/*.ts" --rule '{"jsdoc/require-jsdoc":["warn",{"require":{"FunctionDeclaration":true,"FunctionExpression":true,"MethodDefinition":true,"ClassDeclaration":true},"enableFixer":false}],"jsdoc/require-description":["warn",{"descriptionStyle":"body"}]}' 
          echo "total=$total" >> $GITHUB_OUTPUT
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Audit frontend JSDoc coverage
        id: frontend-audit
        run: |
          cd frontend
              - name: Write frontend ESLint config with JSDoc rules
                    run: |
                            cat > frontend/eslint.config.mjs << 'ESLINTEOF'
                                    import js from "@eslint/js";
                                            import tsPlugin from "@typescript-eslint/eslint-plugin";
                                                    import tsParser from "@typescript-eslint/parser";
                                                            import reactHooks from "eslint-plugin-react-hooks";
                                                                    import reactRefresh from "eslint-plugin-react-refresh";
                                                                            import jsdocPlugin from "eslint-plugin-jsdoc";
                                                                                    import globals from "globals";
                                                                                            export default [
                                                                                                      { ignores: ["dist", "src/__tests__/**"] },
                                                                                                                {
                                                                                                                            files: ["src/**/*.{ts,tsx}"],
                                                                                                                                        languageOptions: {
                                                                                                                                                      ecmaVersion: 2020,
                                                                                                                                                                    globals: globals.browser,
                                                                                                                                                                                  parser: tsParser
                                                                                                                                                                                              },
                                                                                                                                                                                                          plugins: {
                                                                                                                                                                                                                        "@typescript-eslint": tsPlugin,
                                                                                                                                                                                                                                      "react-hooks": reactHooks,
                                                                                                                                                                                                                                                    "react-refresh": reactRefresh,
                                                                                                                                                                                                                                                                  jsdoc: jsdocPlugin
                                                                                                                                                                                                                                                                              },
                                                                                                                                                                                                                                                                                          rules: {
                                                                                                                                                                                                                                                                                                        "jsdoc/require-jsdoc": ["warn", {
                                                                                                                                                                                                                                                                                                                        require: {
                                                                                                                                                                                                                                                                                                                                          FunctionDeclaration: true,
                                                                                                                                                                                                                                                                                                                                                            MethodDefinition: true,
                                                                                                                                                                                                                                                                                                                                                                              ClassDeclaration: true,
                                                                                                                                                                                                                                                                                                                                                                                                FunctionExpression: true
                                                                                                                                                                                                                                                                                                                                                                                                                },
                                                                                                                                                                                                                                                                                                                                                                                                                                enableFixer: false
                                                                                                                                                                                                                                                                                                                                                                                                                                              }],
                                                                                                                                                                                                                                                                                                                                                                                                                                                            "jsdoc/require-description": ["warn", { descriptionStyle: "body" }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ESLINTEOF
          total=$(grep -rE "^(export (default )?(async )?function|export (default )?class|export const [a-zA-Z]+ = )" src --include="*.ts" --include="*.tsx" | grep -v __tests__ | wc -l | tr -d ' ')
          output=$(npx eslint "src/**/*.{ts,tsx}" --rule '{"jsdoc/require-jsdoc":["warn",{"require":{"FunctionDeclaration":true,"FunctionExpression":true,"MethodDefinition":true,"ClassDeclaration":true},"enableFixer":false}],"jsdoc/require-description":["warn",{"descriptionStyle":"body"}]}' --plugin jsdoc --format compact 2>&1 || true)
          echo "total=$total" >> $GITHUB_OUTPUT
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPU
      - name: Get list of changed TS/TSX files
        id: changed-files
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx' | grep -v '__tests__' | grep -v '.d.ts' | head -30 || echo "(none)")
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-quality
          message: |
            ## PR Quality Report
            ### Changed TypeScript Files
            ```
            ${{ steps.changed-files.outputs.list }}
            ```
            ---
            ### Backend Lint & Comment Audit
            > **Exported symbols found:** ${{ steps.backend-audit.outputs.total }}
            <details>
            <summary>Show backend JSDoc warnings</summary>
            ```
            ${{ steps.backend-audit.outputs.result }}
            ```
            </details>
            ---
            ### Frontend Lint & Comment Audit
            > **Exported symbols found:** ${{ steps.frontend-audit.outputs.total }}
            <details>
            <summary>Show frontend JSDoc warnings</summary>
            ```
            ${{ steps.frontend-audit.outputs.result }}
            ```
            </details>
            ---
            ### What was auto-fixed
            - Prettier formatting applied to all changed `.ts` / `.tsx` files
            - Missing JSDoc stubs (`/** */`) inserted on exported functions and classes via ESLint fixer
            - Auto-fix commits are pushed back to this PR branch
            > :warning: Review any remaining JSDoc warnings above. Fill in descriptions, `@param`, and `@returns` tags where shown.
