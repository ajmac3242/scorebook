name: PR Quality Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  lint-backend:
    name: Lint & Format Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Prettier format
        run: cd backend && npx prettier --write "src/**/*.ts"

      - name: ESLint + JSDoc fixer
        run: cd backend && npx eslint "src/**/*.ts" --fix || true

      - name: Commit formatting & JSDoc stubs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(backend): auto-format and JSDoc stubs"
          file_pattern: "backend/src/**"
          push_options: "--force-with-lease"

  lint-frontend:
    name: Lint & Format Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Prettier format
        run: cd frontend && npx prettier --write "src/**/*.{ts,tsx}"

      - name: ESLint + JSDoc fixer
        run: cd frontend && npx eslint "src/**/*.{ts,tsx}" --fix || true

      - name: Commit formatting & JSDoc stubs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(frontend): auto-format and JSDoc stubs"
          file_pattern: "frontend/src/**"
          push_options: "--force-with-lease"

  test:
    name: Unit Tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend]
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: cd ${{ matrix.app }} && npm ci

      - name: Run tests with coverage
        run: cd ${{ matrix.app }} && npm test -- --coverage --coverageReporters=json-summary --coverageReporters=text 2>&1 | tee ../coverage-${{ matrix.app }}.txt

      - name: Extract coverage summary
        id: coverage
        run: |
          if [ -f ${{ matrix.app }}/coverage/coverage-summary.json ]; then
            lines=$(node -e "
              const s = require('./${{ matrix.app }}/coverage/coverage-summary.json').total;
              console.log('Statements: ' + s.statements.pct + '% | Branches: ' + s.branches.pct + '% | Functions: ' + s.functions.pct + '% | Lines: ' + s.lines.pct + '%');
            ")
          else
            lines="Coverage summary not available"
          fi
          echo "summary=$lines" >> $GITHUB_OUTPUT

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: ${{ matrix.app }}/coverage/
          retention-days: 7

      - name: Save coverage summary
        run: echo "${{ steps.coverage.outputs.summary }}" > coverage-summary-${{ matrix.app }}.txt

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-${{ matrix.app }}
          path: coverage-summary-${{ matrix.app }}.txt
          retention-days: 7

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269555264437:role/github_deployment
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format (auto-fix)
        run: cd infra && terraform fmt -recursive

      - name: Commit Terraform formatting
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(infra): auto-format Terraform files"
          file_pattern: "infra/**/*.tf"
          push_options: "--force-with-lease"

      - name: Terraform Init
        run: cd infra && terraform init

      - name: Terraform Plan
        id: plan
        run: |
          cd infra
          terraform plan -no-color -out=tfplan > plan_output.txt
          echo "plan<<EOF" >> $GITHUB_OUTPUT
          cat plan_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment Plan on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan
          message: |
            ## Terraform Plan
            <details>
            <summary>Show Plan</summary>

            ```hcl
            ${{ steps.plan.outputs.plan }}
            ```
            </details>

            > This is a plan only. Changes are applied after merge to `main`.

  comment-audit:
    name: Comment Quality Audit
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install audit tools
        run: |
          cd backend && npm ci && npm install --save-dev eslint-plugin-jsdoc @typescript-eslint/eslint-plugin @typescript-eslint/parser
          cd ../frontend && npm ci && npm install --save-dev eslint-plugin-jsdoc

      - name: Audit backend JSDoc coverage
        id: backend-audit
        run: |
          cd backend
          total=$(grep -rE "^(export (async )?function|export (default )?class|export const [a-zA-Z]+ = (async )?(function|\.\.\.|(\())) " src --include="*.ts" | grep -v __tests__ | wc -l | tr -d ' ')
          output=$(npx eslint "src/**/*.ts" --rule '{"jsdoc/require-jsdoc":["warn",{"require":{"FunctionDeclaration":true,"FunctionExpression":true,"MethodDefinition":true,"ClassDeclaration":true},"enableFixer":false}],"jsdoc/require-description":["warn",{"descriptionStyle":"body"}]}' --plugin jsdoc --format compact 2>&1 || true)
          echo "total=$total" >> $GITHUB_OUTPUT
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Audit frontend JSDoc coverage
        id: frontend-audit
        run: |
          cd frontend
          total=$(grep -rE "^(export (default )?(async )?function|export (default )?class|export const [a-zA-Z]+ = )" src --include="*.ts" --include="*.tsx" | grep -v __tests__ | wc -l | tr -d ' ')
          output=$(npx eslint "src/**/*.{ts,tsx}" --rule '{"jsdoc/require-jsdoc":["warn",{"require":{"FunctionDeclaration":true,"FunctionExpression":true,"MethodDefinition":true,"ClassDeclaration":true},"enableFixer":false}],"jsdoc/require-description":["warn",{"descriptionStyle":"body"}]}' --plugin jsdoc --format compact 2>&1 || true)
          echo "total=$total" >> $GITHUB_OUTPUT
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download backend coverage summary
        uses: actions/download-artifact@v4
        with:
          name: coverage-summary-backend
          path: ./coverage-summaries
        continue-on-error: true

      - name: Download frontend coverage summary
        uses: actions/download-artifact@v4
        with:
          name: coverage-summary-frontend
          path: ./coverage-summaries
        continue-on-error: true

      - name: Read coverage summaries
        id: coverage-summaries
        run: |
          backend_cov=$(cat ./coverage-summaries/coverage-summary-backend.txt 2>/dev/null || echo "Not available")
          frontend_cov=$(cat ./coverage-summaries/coverage-summary-frontend.txt 2>/dev/null || echo "Not available")
          echo "backend<<EOF" >> $GITHUB_OUTPUT
          echo "$backend_cov" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "frontend<<EOF" >> $GITHUB_OUTPUT
          echo "$frontend_cov" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get list of changed TS/TSX files
        id: changed-files
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx' | grep -v '__tests__' | grep -v '.d.ts' | head -30 || echo "(none)")
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-quality
          message: |
            ## PR Quality Report

            ### Changed TypeScript Files
            ```
            ${{ steps.changed-files.outputs.list }}
            ```

            ---

            ### Test Coverage
            | App | Coverage |
            |-----|----------|
            | Backend | ${{ steps.coverage-summaries.outputs.backend }} |
            | Frontend | ${{ steps.coverage-summaries.outputs.frontend }} |

            ---

            ### Backend Lint & Comment Audit
            > **Exported symbols found:** ${{ steps.backend-audit.outputs.total }}
            <details>
            <summary>Show backend JSDoc warnings</summary>

            ```
            ${{ steps.backend-audit.outputs.result }}
            ```
            </details>

            ---

            ### Frontend Lint & Comment Audit
            > **Exported symbols found:** ${{ steps.frontend-audit.outputs.total }}
            <details>
            <summary>Show frontend JSDoc warnings</summary>

            ```
            ${{ steps.frontend-audit.outputs.result }}
            ```
            </details>

            ---

            ### What was auto-fixed
            - Prettier formatting applied to `.ts` / `.tsx` files
            - JSDoc stubs inserted where possible via ESLint fixer
            - Terraform files auto-formatted via `terraform fmt`
            - Auto-fix commits pushed back to this PR branch

            > Review remaining JSDoc warnings and fill in `@param` / `@returns` details.
