name: PR Quality Checks

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write   # needed to push formatting fixes
  pull-requests: write  # needed to post PR comments

jobs:

  # ---------------------------------------------------------------
  # Job 1: Lint & format backend (Prettier + ESLint via ts-standard)
  # ---------------------------------------------------------------
  lint-backend:
    name: Lint & Format Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci
          npm install --save-dev prettier eslint @typescript-eslint/eslint-plugin @typescript-eslint/parser

      - name: Run Prettier (auto-format)
        run: |
          cd backend
          npx prettier --write "src/**/*.ts"

      - name: Run ESLint
        run: |
          cd backend
          npx eslint "src/**/*.ts" --max-warnings=0 || true

      - name: Commit formatting fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(backend): auto-format with Prettier"
          file_pattern: "backend/src/**/*.ts"

  # ---------------------------------------------------------------
  # Job 2: Lint & format frontend (ESLint already configured)
  # ---------------------------------------------------------------
  lint-frontend:
    name: Lint & Format Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci
          npm install --save-dev prettier

      - name: Run Prettier (auto-format)
        run: |
          cd frontend
          npx prettier --write "src/**/*.{ts,tsx}"

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint || true

      - name: Commit formatting fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(frontend): auto-format with Prettier"
          file_pattern: "frontend/src/**/*.{ts,tsx}"

  # ---------------------------------------------------------------
  # Job 3: Post a summary comment on the PR with lint results
  # ---------------------------------------------------------------
  pr-comment:
    name: Post PR Summary
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
          npm install --save-dev prettier eslint @typescript-eslint/eslint-plugin @typescript-eslint/parser

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Collect backend lint output
        id: backend-lint
        run: |
          cd backend
          output=$(npx eslint "src/**/*.ts" --format compact 2>&1 || true)
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Collect frontend lint output
        id: frontend-lint
        run: |
          cd frontend
          output=$(npm run lint -- --format compact 2>&1 || true)
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-quality
          message: |
            ## PR Quality Report

            ### Backend Lint
            ```
            ${{ steps.backend-lint.outputs.result }}
            ```

            ### Frontend Lint
            ```
            ${{ steps.frontend-lint.outputs.result }}
            ```

            > Formatting auto-applied via Prettier. Review any ESLint warnings above.
