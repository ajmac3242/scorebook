<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <radialGradient id="g" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF9B4A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#B84400" stop-opacity="0.3"/>
    </radialGradient>
    <clipPath id="clip">
      <circle cx="16" cy="16" r="12.5"/>
    </clipPath>
  </defs>
  <!-- Basketball body -->
  <circle cx="16" cy="16" r="12.5" fill="#F46B1B"/>
  <!-- Depth shading -->
  <circle cx="16" cy="16" r="12.5" fill="url(#g)"/>
  <!-- Seams clipped inside ball — matching MUI SportsBasketball orientation -->
  <g clip-path="url(#clip)" stroke="white" stroke-width="1.1" fill="none" stroke-linecap="round">
    <!-- Horizontal equator -->
    <path d="M3.5 16 L28.5 16"/>
    <!-- Vertical center line -->
    <path d="M16 3.5 L16 28.5"/>
    <!-- Left seam — bows outward LEFT (convex left) -->
    <path d="M16 3.5 C10 7 7 12 7 16 C7 20 10 25 16 28.5"/>
    <!-- Right seam — bows outward RIGHT (convex right) -->
    <path d="M16 3.5 C22 7 25 12 25 16 C25 20 22 25 16 28.5"/>
  </g>
</svg>
