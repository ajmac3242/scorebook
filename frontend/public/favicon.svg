<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Basketball body -->
  <circle cx="16" cy="16" r="15" fill="#F46B1B"/>
  <!-- Subtle shading for depth -->
  <circle cx="16" cy="16" r="15" fill="url(#grad)"/>
  <!-- White seam lines -->
  <!-- Vertical center seam -->
  <path d="M16 1 C16 1 16 31 16 31" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- Horizontal center seam -->
  <path d="M1 16 C1 16 31 16 31 16" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- Left curved seam -->
  <path d="M6 3.5 C1 10 1 22 6 28.5" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- Right curved seam -->
  <path d="M26 3.5 C31 10 31 22 26 28.5" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <defs>
    <radialGradient id="grad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FF9B4A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C04C00" stop-opacity="0.25"/>
    </radialGradient>
  </defs>
</svg>